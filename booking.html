<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking | RCC PU Solutions</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .booking-wrapper { padding: 60px 20px; min-height: 80vh; display: flex; justify-content: center; align-items: center; }
        .form-card { background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 100%; max-width: 550px; color: #333; }
        .form-step { display: none; }
        .form-step.active { display: block; }
        .form-card h2 { color: #00a651; margin-bottom: 25px; font-size: 1.8rem; text-align: center; font-weight: bold; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; text-align: left; }
        .form-card input, .form-card select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        .btn-container { display: flex; gap: 10px; margin-top: 25px; }
        .btn-next, .btn-submit { background: #00a651; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1rem; transition: 0.3s; }
        .btn-back { background: #6c757d; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; width: 40%; font-weight: bold; transition: 0.3s; }
        .btn-next:hover, .btn-submit:hover { background: #008541; transform: translateY(-2px); }
        .hidden-field { display: none; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <img src="logo.png" alt="Logo">
        <span class="company-name">RCC PU Solutions</span>
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="booking.html" style="color: #00a651; font-weight: bold;">Get a Quote / Book Ocular</a>
        <a href="contact.html">Contact Us</a>
    </nav>
</header>

<section class="hero-section contact-bg booking-wrapper">
    <div class="form-card">
        <form action="https://formspree.io/f/xjglkenr" method="POST" id="bookingForm">
            
            <div class="form-step active" id="step1">
                <h2>Contact Details</h2>
                <div class="input-group">
                    <input type="text" name="Full Name" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <input type="tel" name="Mobile Number" placeholder="Mobile Number" required>
                </div>
                <div class="input-group">
                    <input type="email" name="Email" placeholder="Email Address" required>
                </div>
                <button type="button" class="btn-next" onclick="nextStep()">Next: Project Details</button>
            </div>

            <div class="form-step" id="step2">
                <h2>Project Details</h2>
                <div class="input-group">
                    <label>What do you need?</label>
                    <select name="Request Type" id="requestChoice" onchange="toggleFormFields()" required>
                        <option value="">-- Select Option --</option>
                        <option value="Quotation Only">Get Estimated Quotation</option>
                        <option value="Ocular Only">Schedule an Ocular Inspection</option>
                        <option value="Both">Both (Estimated + Ocular)</option>
                    </select>
                </div>

                <div class="input-group hidden-field" id="serviceTypeDiv">
                    <label>Service Type</label>
                    <select name="Service Type">
                        <option value="PU Flooring">PU Flooring</option>
                        <option value="Epoxy Coating">Epoxy Coating</option>
                        <option value="Waterproofing">Waterproofing</option>
                    </select>
                </div>

                <div class="input-group hidden-field" id="sqmDiv">
                    <input type="text" name="Estimated SQM" placeholder="Estimated SQM (e.g. 100)">
                </div>

                <div class="input-group hidden-field" id="locationDiv">
                    <input type="text" name="Location" placeholder="Exact Location / Address">
                </div>

                <div class="input-group hidden-field" id="dateDiv">
                    <label>Preferred Inspection Date</label>
                    <input type="date" name="Preferred Date">
                </div>

                <div class="btn-container">
                    <button type="button" class="btn-back" onclick="prevStep()">Back</button>
                    <button type="submit" class="btn-submit">Submit Request</button>
                </div>
            </div>
        </form>
    </div>
</section>

<footer>
    &copy; 2026 RCC PU Solutions. All rights reserved.
</footer>

<script>
    function nextStep() {
        const inputs = document.querySelectorAll('#step1 input');
        let valid = true;
        inputs.forEach(input => {
            if(!input.value) {
                valid = false;
                input.style.borderColor = "red";
            } else {
                input.style.borderColor = "#ccc";
            }
        });

        if(valid) {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
        }
    }

    function prevStep() {
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step1').classList.add('active');
    }

    function toggleFormFields() {
        const choice = document.getElementById('requestChoice').value;
        const fields = {
            service: document.getElementById('serviceTypeDiv'),
            sqm: document.getElementById('sqmDiv'),
            loc: document.getElementById('locationDiv'),
            date: document.getElementById('dateDiv')
        };

        Object.values(fields).forEach(f => f.classList.add('hidden-field'));

        if (choice === "Quotation Only") {
            fields.service.classList.remove('hidden-field');
            fields.sqm.classList.remove('hidden-field');
            fields.loc.classList.remove('hidden-field');
        } else if (choice === "Ocular Only") {
            fields.service.classList.remove('hidden-field');
            fields.loc.classList.remove('hidden-field');
            fields.date.classList.remove('hidden-field');
        } else if (choice === "Both") {
            Object.values(fields).forEach(f => f.classList.remove('hidden-field'));
        }
    }
</script>

</body>
</html>
