<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section style="background: url('booking-bg.jpg');">
        <div class="form-container" style="background: white; padding: 40px; border-radius: 15px; width: 100%; max-width: 500px; color: #333;">
            <h2 style="text-align: center; color: #00a651;">Contact Details</h2>
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                <input type="text" name="name" placeholder="Full Name" required style="width: 100%; padding: 12px; margin: 10px 0;">
                <input type="tel" name="phone" placeholder="Mobile Number" required style="width: 100%; padding: 12px; margin: 10px 0;">
                <input type="email" name="email" placeholder="Email Address" required style="width: 100%; padding: 12px; margin: 10px 0;">
                <textarea name="message" placeholder="Project Details" rows="4" style="width: 100%; padding: 12px; margin: 10px 0;"></textarea>
                <button type="submit" style="width: 100%; padding: 15px; background: #00a651; color: white; border: none; font-weight: bold; border-radius: 5px; cursor: pointer;">Next: Project Details</button>
            </form>
        </div>
    </section>
</body>
</html>
